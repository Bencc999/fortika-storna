# =========================================================
#  Panel treści (Decap CMS) – Biuro Rachunkowe Fortika
#  Adres panelu: https://fortika-storna.netlify.app/admin/
# =========================================================

backend:
  name: github
  repo: Bencc999/fortika-storna   # repozytorium na GitHubie (login/nazwa)
  branch: main
  commit_messages:
    create: "Panel: dodano {{collection}} „{{slug}}”"
    update: "Panel: zmiana – {{slug}}"
    delete: "Panel: usunięto {{collection}} „{{slug}}”"
    uploadMedia: "Panel: wgrano zdjęcie {{path}}"
    deleteMedia: "Panel: usunięto zdjęcie {{path}}"

# Pozwala edytować treści lokalnie (npx decap-server) bez logowania do GitHuba.
local_backend: true

locale: pl
logo_url: /admin/logo.svg
# Adres używany w przyciskach „Zobacz na żywo”. Po podpięciu domeny zmień na https://fortika.pl
site_url: https://fortika-storna.netlify.app
display_url: https://fortika-storna.netlify.app

# Gdzie zapisują się wgrane zdjęcia
media_folder: src/img/uploads
public_folder: /img/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:

  # =======================================================
  #  1. TELEFON, ADRES I DANE FIRMY – najczęściej zmieniane
  # =======================================================
  - name: ustawienia
    label: "Telefon, adres i godziny"
    label_singular: "Dane kontaktowe"
    description: >
      Numer telefonu, e-mail, adres, godziny pracy i dane rejestrowe.
      Zmiana tutaj od razu aktualizuje wszystkie miejsca na stronie (nagłówek, baner, kontakt, stopkę).
    files:
      - name: firma
        label: "Dane kontaktowe i rejestrowe firmy"
        file: src/_data/firma.json
        fields:
          - { name: telefon, label: "📞 Numer telefonu", widget: string, hint: "Np. 42 123 45 67 albo +48 600 123 456. Pojawi się w nagłówku, banerze, sekcji Kontakt i stopce. Na telefonie będzie można w niego kliknąć, żeby zadzwonić." }
          - { name: email, label: "✉️ Adres e-mail", widget: string, hint: "Na ten adres trafiają też wiadomości z formularzy." }
          - { name: godziny, label: "🕘 Godziny pracy", widget: string, required: false, hint: "Np. pon.–pt.: 8:00–16:00" }
          - { name: ulica, label: "📍 Ulica i numer", widget: string }
          - { name: kod_pocztowy, label: "Kod pocztowy", widget: string }
          - { name: miasto, label: "Miasto", widget: string }
          - { name: dzielnica, label: "Dzielnica", widget: string, required: false, hint: "Wyświetla się w nawiasie po mieście w sekcji Kontakt." }
          - { name: facebook, label: "Adres profilu na Facebooku", widget: string, required: false, hint: "Cały adres, np. https://www.facebook.com/fortika. Zostaw puste, żeby ukryć ikonę Facebooka." }
          - { name: opis_stopka, label: "Krótki opis firmy w stopce", widget: text }
          - { name: nazwa, label: "Pełna nazwa firmy", widget: string, hint: "Dane rejestrowe poniżej zmieniaj tylko, gdy zmienią się w KRS." }
          - { name: nip, label: "NIP", widget: string }
          - { name: krs, label: "KRS", widget: string }
          - { name: regon, label: "REGON", widget: string }

  # =======================================================
  #  2. SEKCJE STRONY GŁÓWNEJ
  # =======================================================
  - name: strona
    label: "Sekcje strony głównej"
    label_singular: "Sekcja"
    description: >
      Sekcje w takiej kolejności, w jakiej widać je na stronie, od góry do dołu.
      Po prawej stronie edytora widzisz podgląd. Na stronie zmiana pojawi się 1–2 minuty po kliknięciu „Opublikuj”.
    files:

      # ---------- 1. BANER ----------
      - name: hero
        label: "1. Baner na górze strony (duży tytuł i przyciski)"
        file: src/_data/hero.json
        fields:
          - { name: nadtytul, label: "Mały złoty napis nad tytułem", widget: string }
          - { name: naglowek, label: "Duży tytuł – pierwsza część (granatowa)", widget: string, hint: "Np. „Księgowość, o którą”." }
          - { name: naglowek_wyrozniony, label: "Duży tytuł – końcówka podkreślona na złoto", widget: string, hint: "Np. „nie musisz się martwić”." }
          - { name: opis, label: "Tekst pod tytułem", widget: text, hint: "2–3 zdania o tym, co robicie." }
          - { name: przycisk_glowny, label: "Napis na złotym przycisku", widget: string, hint: "Przycisk przenosi do formularza kontaktowego." }
          - { name: przycisk_drugi, label: "Napis na białym przycisku", widget: string, hint: "Przycisk przenosi do sekcji Wycena." }
          - { name: zacheta_telefon, label: "Tekst przed numerem telefonu (bez numeru!)", widget: string, hint: "Np. „Wolisz porozmawiać? Zadzwoń:”. Numer dopisuje się sam. Zmieniasz go w menu „Telefon, adres i godziny”." }
          - name: wyrozniki
            label: "Plakietki pod przyciskami"
            label_singular: "plakietkę"
            widget: list
            required: false
            collapsed: false
            hint: "Krótkie hasła, np. „Stały opiekun”. Najlepiej 2–4."
            field: { name: tekst, label: "Treść plakietki", widget: string }
          - { name: obraz, label: "Zdjęcie zamiast ilustracji", widget: image, required: false, choose_url: false, hint: "Zostaw puste, żeby została obecna ilustracja. Najlepiej zdjęcie ok. 900×800 px." }

      # ---------- 2. USŁUGI ----------
      - name: uslugi
        label: "2. Usługi (karty z ikonami)"
        file: src/_data/uslugi.json
        fields:
          - { name: nadtytul, label: "Mały złoty napis nad tytułem", widget: string }
          - { name: naglowek, label: "Tytuł sekcji", widget: string }
          - { name: opis, label: "Tekst pod tytułem", widget: text, required: false }
          - name: uslugi
            label: "Karty usług"
            label_singular: "usługę"
            widget: list
            summary: "{{fields.nazwa}}"
            collapsed: true
            hint: "Kliknij nazwę usługi, żeby ją rozwinąć. Kolejność zmienisz, przeciągając kartę za uchwyt ═."
            fields:
              - { name: nazwa, label: "Nazwa usługi", widget: string }
              - { name: opis, label: "Opis usługi", widget: text, hint: "1–2 zdania." }
              - name: ikona
                label: "Ikona"
                widget: select
                default: dokument
                options: &ikony
                  - { label: "Księga / tabela", value: ksiega }
                  - { label: "Procent", value: procent }
                  - { label: "Ludzie (kadry)", value: ludzie }
                  - { label: "Urząd", value: urzad }
                  - { label: "Dokument z ptaszkiem", value: dokument }
                  - { label: "Gwiazda", value: gwiazda }
                  - { label: "Koszyk (handel)", value: koszyk }
                  - { label: "Teczka (usługi)", value: teczka }
                  - { label: "Fabryka (produkcja)", value: fabryka }
                  - { label: "Osoba", value: osoba }
                  - { label: "Zegar", value: zegar }
                  - { label: "Globus", value: globus }
                  - { label: "Pinezka na mapie", value: pinezka }
                  - { label: "Kalkulator", value: kalkulator }
                  - { label: "Wykres", value: wykres }
                  - { label: "Tarcza (bezpieczeństwo)", value: tarcza }

      # ---------- 3. DLA KOGO ----------
      - name: dla_kogo
        label: "3. Dla kogo (formy prawne i branże)"
        file: src/_data/dla_kogo.json
        fields:
          - { name: nadtytul, label: "Mały złoty napis nad tytułem", widget: string }
          - { name: naglowek, label: "Tytuł sekcji", widget: string }
          - { name: opis, label: "Tekst pod tytułem", widget: text, required: false }
          - { name: formy_tytul, label: "Tytuł lewej kolumny", widget: string, hint: "Np. „Formy prawne”." }
          - name: formy
            label: "Lewa kolumna: formy prawne"
            label_singular: "formę prawną"
            widget: list
            summary: "{{fields.nazwa}}"
            collapsed: true
            fields:
              - { name: nazwa, label: "Nazwa", widget: string }
              - { name: opis, label: "Krótki opis", widget: string }
          - { name: branze_tytul, label: "Tytuł prawej kolumny", widget: string, hint: "Np. „Branże”." }
          - name: branze
            label: "Prawa kolumna: branże"
            label_singular: "branżę"
            widget: list
            summary: "{{fields.nazwa}}"
            collapsed: true
            fields:
              - { name: nazwa, label: "Nazwa branży", widget: string }
              - { name: opis, label: "Krótki opis", widget: string }
              - { name: ikona, label: "Ikona", widget: select, default: teczka, options: *ikony }

      # ---------- 4. DLACZEGO FORTIKA ----------
      - name: dlaczego
        label: "4. Dlaczego Fortika (atuty i zdjęcie zespołu)"
        file: src/_data/dlaczego.json
        fields:
          - { name: nadtytul, label: "Mały złoty napis nad tytułem", widget: string }
          - { name: naglowek, label: "Tytuł sekcji", widget: string }
          - { name: opis, label: "Tekst pod tytułem", widget: text }
          - { name: zdjecie, label: "📷 Zdjęcie zespołu lub biura", widget: image, required: false, choose_url: false, hint: "Zdjęcie poziome, najlepiej 1200×800 px. Dopóki go nie dodasz, w tym miejscu jest szara ramka." }
          - { name: zdjecie_opis, label: "Co widać na zdjęciu", widget: string, required: false, hint: "Krótki opis dla osób niewidomych i dla Google, np. „Zespół biura przy biurku”." }
          - { name: zdjecie_podpis, label: "Podpis pod zdjęciem", widget: string, required: false }
          - name: atuty
            label: "Atuty (kafelki po prawej)"
            label_singular: "atut"
            widget: list
            summary: "{{fields.tytul}}"
            collapsed: true
            fields:
              - { name: tytul, label: "Tytuł", widget: string }
              - { name: opis, label: "Opis", widget: text }
              - { name: liczba, label: "Liczba w kwadracie zamiast ikony", widget: string, required: false, hint: "Np. „10+”. Zostaw puste, żeby pokazać ikonę." }
              - { name: ikona, label: "Ikona", widget: select, default: zegar, options: *ikony }

      # ---------- 5. JAK ZACZĄĆ ----------
      - name: kroki
        label: "5. Jak zacząć współpracę (kroki)"
        file: src/_data/kroki.json
        fields:
          - { name: nadtytul, label: "Mały złoty napis nad tytułem", widget: string }
          - { name: naglowek, label: "Tytuł sekcji", widget: string }
          - { name: opis, label: "Tekst pod tytułem", widget: text, required: false }
          - name: kroki
            label: "Kroki"
            label_singular: "krok"
            widget: list
            summary: "{{fields.tytul}}"
            collapsed: true
            hint: "Numery nadają się same, według kolejności. Najlepiej wyglądają 4 kroki."
            fields:
              - { name: tytul, label: "Nazwa kroku", widget: string }
              - { name: opis, label: "Opis kroku", widget: text }

      # ---------- 6. WYCENA ----------
      - name: wycena
        label: "6. Wycena i cennik 💰"
        file: src/_data/wycena.json
        fields:
          - { name: nadtytul, label: "Mały złoty napis nad tytułem", widget: string }
          - { name: naglowek, label: "Tytuł sekcji", widget: string }
          - { name: opis, label: "Tekst pod tytułem", widget: text }
          - { name: pokaz_cennik, label: "Pokazuj cennik", widget: boolean, default: true, hint: "Wyłącz, jeśli wolisz zostawić sam formularz wyceny." }
          - name: cennik
            label: "Ceny"
            label_singular: "cenę"
            widget: list
            required: false
            collapsed: false
            summary: "{{fields.nazwa}}: {{fields.cena}}"
            fields:
              - { name: nazwa, label: "Usługa", widget: string, hint: "Np. „Pełna księgowość”." }
              - { name: cena, label: "Cena", widget: string, hint: "Razem z dopiskiem, np. „od 450 zł netto/mies.”." }
          - { name: uwaga, label: "Mały dopisek pod cenami", widget: string, required: false }
          - { name: formularz_tytul, label: "Tytuł formularza wyceny", widget: string }
          - { name: formularz_przycisk, label: "Napis na przycisku formularza", widget: string }

      # ---------- 7. OPINIE ----------
      - name: opinie
        label: "7. Opinie klientów ⭐"
        file: src/_data/opinie.json
        fields:
          - { name: pokaz_sekcje, label: "Pokazuj sekcję opinii", widget: boolean, default: true }
          - { name: nadtytul, label: "Mały złoty napis nad tytułem", widget: string }
          - { name: naglowek, label: "Tytuł sekcji", widget: string }
          - name: opinie
            label: "Opinie"
            label_singular: "opinię"
            widget: list
            required: false
            summary: "{{fields.autor}}"
            collapsed: true
            hint: "Dodawaj tylko prawdziwe opinie, za zgodą klienta. Dopóki lista jest pusta, na stronie widać trzy puste ramki."
            fields:
              - { name: tresc, label: "Treść opinii", widget: text }
              - { name: autor, label: "Imię i nazwisko (lub imię i inicjał)", widget: string }
              - { name: firma, label: "Firma lub branża", widget: string, required: false }
              - { name: zdjecie, label: "Zdjęcie lub logo klienta", widget: image, required: false, choose_url: false, hint: "Kwadratowe, ok. 200×200 px." }

      # ---------- 8. FAQ ----------
      - name: faq
        label: "8. Najczęstsze pytania (FAQ) ❓"
        file: src/_data/faq.json
        fields:
          - { name: nadtytul, label: "Mały złoty napis nad tytułem", widget: string }
          - { name: naglowek, label: "Tytuł sekcji", widget: string }
          - name: opis
            label: "Tekst pod tytułem"
            widget: markdown
            required: false
            minimal: true
            buttons: [bold, italic, link]
            editor_components: []
            hint: "Link do formularza: zaznacz słowa, kliknij ikonę łańcucha i wpisz #kontakt."
          - name: pytania
            label: "Pytania i odpowiedzi"
            label_singular: "pytanie"
            widget: list
            summary: "{{fields.pytanie}}"
            collapsed: true
            hint: "Kliknij pytanie, żeby je rozwinąć. Nowe dodasz przyciskiem „Dodaj pytanie”, usuniesz krzyżykiem ×."
            fields:
              - { name: pytanie, label: "Pytanie", widget: string }
              - name: odpowiedz
                label: "Odpowiedź"
                widget: markdown
                minimal: true
                buttons: [bold, italic, link, bulleted-list]
                editor_components: []

      # ---------- 9. KONTAKT ----------
      - name: kontakt
        label: "9. Kontakt (teksty i formularz)"
        file: src/_data/kontakt.json
        fields:
          - { name: nadtytul, label: "Mały złoty napis nad tytułem", widget: string }
          - { name: naglowek, label: "Tytuł sekcji", widget: string }
          - { name: opis, label: "Tekst pod tytułem", widget: text, hint: "Telefon, e-mail, adres i godziny zmieniasz w menu „Telefon, adres i godziny”." }
          - { name: formularz_tytul, label: "Tytuł formularza", widget: string }
          - { name: formularz_przycisk, label: "Napis na przycisku formularza", widget: string }

  # =======================================================
  #  3. PODSTRONY
  # =======================================================
  - name: podstrony
    label: "Polityka prywatności"
    label_singular: "Podstrona"
    files:
      - name: polityka
        label: "Polityka prywatności (RODO)"
        file: src/polityka-prywatnosci.md
        fields:
          - { name: layout, label: "Szablon", widget: hidden, default: polityka.njk }
          - { name: permalink, label: "Adres", widget: hidden, default: polityka-prywatnosci.html }
          - { name: tytul, label: "Tytuł strony", widget: string }
          - { name: wzor, label: "Pokazuj żółtą ramkę „Wzór do weryfikacji”", widget: boolean, default: true, hint: "Wyłącz, gdy prawnik sprawdzi treść." }
          - { name: body, label: "Treść", widget: markdown, buttons: [bold, italic, link, heading-two, bulleted-list, numbered-list], editor_components: [] }

  # =======================================================
  #  4. GOOGLE I UDOSTĘPNIANIE – zmieniane rzadko
  # =======================================================
  - name: seo
    label: "Google i Facebook (rzadko zmieniane)"
    label_singular: "Ustawienie"
    description: "Jak strona wygląda w wynikach Google i po udostępnieniu linku na Facebooku lub w Messengerze."
    editor: { preview: false }
    files:
      - name: seo
        label: "Opis strony dla Google i Facebooka"
        file: src/_data/seo.json
        fields:
          - { name: tytul, label: "Tytuł w Google", widget: string, hint: "Widoczny na karcie przeglądarki i w wynikach Google. Najlepiej do 60 znaków." }
          - { name: opis, label: "Opis w Google", widget: text, hint: "Krótki tekst pod tytułem w wynikach wyszukiwania. Najlepiej 140–160 znaków." }
          - { name: og_tytul, label: "Tytuł po udostępnieniu linku (Facebook, Messenger)", widget: string }
          - { name: og_opis, label: "Opis po udostępnieniu linku", widget: text }
          - { name: og_obraz, label: "Obrazek po udostępnieniu linku", widget: image, required: false, choose_url: false, hint: "Poziomy, 1200×630 px." }
          - { name: adres_strony, label: "Adres strony", widget: string, hint: "Zmień na https://fortika.pl/ po podpięciu domeny." }
